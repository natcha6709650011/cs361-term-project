<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>จัดการห้อง | CS Thammasat</title>
    <link rel="stylesheet" href="room-types.css?v=2" />
    <link rel="stylesheet" href="admin-rooms.css" />
  </head>
  <body>
    <style>
      .main-nav > a[href="index.html"], 
      .main-nav > a[href="admin-rooms.html"] { display: inline-block !important; }
    </style>
    <div data-site-header></div>

    <main class="admin">
      <div class="admin-head">
        <h1>รายการห้อง</h1>
        <div class="admin-filters">
          <label class="admin-search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" id="fSearch" placeholder="ค้นหาเลขห้อง" />
          </label>
          <select id="fType" aria-label="ประเภทห้อง"><option value="">ประเภทห้อง</option></select>
          <select id="fFloor" aria-label="ชั้น"><option value="">ชั้น</option></select>
        </div>
      </div>
      <p id="adminStatus" class="admin__status" role="status" hidden></p>

      <div class="admin-card">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>ห้อง</th><th>ประเภทห้อง</th><th class="c">ความจุ</th><th class="c">ชั้น</th>
                <th class="c">เปิดใช้งาน</th><th class="c">เปิดให้จอง</th><th></th>
              </tr>
            </thead>
            <tbody id="roomRows"><tr><td colspan="7" class="admin-empty">กำลังโหลด...</td></tr></tbody>
          </table>
        </div>
      </div>
    </main>

    <div class="row-menu" id="rowMenu" hidden>
      <button type="button" data-act="detail">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>รายละเอียด
      </button>
      <button type="button" data-act="edit">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg>แก้ไข
      </button>
    </div>

    <div class="admin-modal" id="roomModal" hidden>
      <div class="admin-modal__backdrop" data-act="close"></div>
      <div class="admin-modal__panel" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <header class="admin-modal__header">
          <h2 id="mTitle"></h2>
          <button type="button" class="admin-modal__close" data-act="close" aria-label="ปิด">&times;</button>
        </header>
        <p id="mNotice" class="admin-modal__notice" hidden></p>
        <div class="admin-modal__body" id="mBody"></div>
        <footer class="admin-modal__actions" id="mActions"></footer>
      </div>
    </div>

    <script src="components/header-component.js"></script>
    <script src="admin-rooms.js"></script>
  </body>
</html>
