<!-- ======================================================
     CSTU Room Booking - Header
     ====================================================== -->

<header class="site-header">

  <!-- Logo -->
  <a
    class="brand"
    href="index.html"
    aria-label="Computer Science Thammasat University"
  >
    <img
      src="assets/cstu-logo.png"
      alt="Computer Science Thammasat University"
    />

    <span class="brand-divider" aria-hidden="true"></span>

    <span class="brand-name">
      <b>CS</b>
      <span>
        COMPUTER SCIENCE<br />
        THAMMASAT UNIVERSITY
      </span>
    </span>
  </a>


  <!-- Mobile menu button -->
  <button
    class="menu-toggle"
    type="button"
    aria-label="เปิดเมนู"
    aria-expanded="false"
  >
    ☰
  </button>


  <!-- Main navigation -->
  <nav class="main-nav" aria-label="เมนูหลัก">

    <!-- Home -->
    <a href="index.html">
      หน้าหลัก
    </a>


    <!-- Room type dropdown -->
    <div class="nav-dropdown">

      <button
        class="dropdown-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="room-type-menu"
      >
        ประเภทห้อง

        <svg
          aria-hidden="true"
          viewBox="0 0 16 10"
        >
          <path d="m2 2 6 6 6-6" />
        </svg>
      </button>


      <div
        class="dropdown-menu"
        id="room-type-menu"
      >
        <a href="room-types.html?type=classroom">
          ห้องเรียน
        </a>

        <a href="room-types.html?type=meeting">
          ห้องประชุม
        </a>

        <a href="room-types.html?type=activity">
          ห้องกิจกรรม
        </a>

        <a href="room-types.html?type=lab">
          ห้องปฏิบัติการ
        </a>

        <a href="room-types.html?type=coworking">
          Co-Working Space
        </a>
      </div>

    </div>


    <!-- Guidelines -->
    <a href="guidelines.html">
      ข้อปฏิบัติ
    </a>


    <!-- Contact -->
    <a href="contact.html">
      ติดต่อเรา
    </a>


    <!-- ==================================================
         Login-required menu
         ================================================== -->

    <a
      data-menu="booking"
      href="booking.html"
    >
      จองห้อง
    </a>


    <a
      data-menu="my-bookings"
      href="my-bookings.html"
    >
      การจองของฉัน
    </a>


    <!-- ==================================================
         Approver only
         ================================================== -->

    <a
      data-menu="approve"
      href="approve-booking.html"
    >
      อนุมัติการจอง
    </a>


    <!-- ==================================================
         Facility Admin only
         ================================================== -->

    <a
      data-menu="manage-room"
      href="manage-room.html"
    >
      จัดการห้อง
    </a>


    <!-- ==================================================
         User profile
         ================================================== -->

    <a
      class="user-link"
      data-menu="profile"
      href="profile.html"
    >
      <span
        class="user-icon"
        aria-hidden="true"
      >
        <svg viewBox="0 0 24 24">
          <circle
            cx="12"
            cy="8"
            r="3.5"
          />

          <path
            d="M4.5 20c.5-4 3.1-6 7.5-6s7 2 7.5 6"
          />
        </svg>
      </span>

      <span class="username">
        Xxxxxxxxx.x
      </span>
    </a>


    <!-- Login -->
    <a
      data-menu="login"
      href="login.html"
    >
      เข้าสู่ระบบ
    </a>


    <!-- Logout -->
    <a
      data-menu="logout"
      href="#"
      onclick="logoutUser(); return false;"
    >
      ออกจากระบบ
    </a>

  </nav>

</header>
