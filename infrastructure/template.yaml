
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Shared Infrastructure as Code for CSTU Room Booking V5

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DB_HOST: !Ref DBHost
        DB_NAME: !Ref DBName
        DB_PORT: !Ref DBPort
        DB_USER: !Ref DBUser

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment

  DBHost:
    Type: String
    Default: cstu-room-database.cefikyua88rq.us-east-1.rds.amazonaws.com
    Description: CSTU RDS MySQL endpoint

  DBName:
    Type: String
    Default: cstu_room_db
    Description: Database name

  DBPort:
    Type: Number
    Default: 3306
    Description: RDS MySQL port

  DBUser:
    Type: String
    Default: admin
    Description: Database username

  DBPassword:
    Type: String
    NoEcho: true
    Description: Database password supplied at deployment time


  NoShowScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: >
      State of the booking No-show / auto-complete schedule. Keep DISABLED while the
      V4 schedule still runs against the same database; set ENABLED at cut-over.

  VpcSecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Default: sg-07bbfe69921bf522b
    Description: Security groups for Lambda functions accessing RDS

  VpcSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-089b9d28eaf352d8b,subnet-0fccb724bebd3081a,subnet-0d8487dc29aa0a0de,subnet-0e31c80e3ed16057a,subnet-0fa733b2a03abd4b0,subnet-014ada63684a48c9a,subnet-08567a765615b987e,subnet-0a4138a1f2100a82b
    Description: Subnets for Lambda functions accessing RDS

  ImageBucketName:
    Type: String
    Default: cstu-room-images1
    Description: S3 bucket for room images

Resources:
  PyMySqlLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${AWS::StackName}-pymysql'
      Description: Shared PyMySQL dependency for RDS-backed Lambda functions
      ContentUri: ../pymysql-layer/
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - x86_64
      RetentionPolicy: Retain

  GetRoomsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/get_rooms/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 15
      MemorySize: 128
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
    Metadata:
      Owner: room-information-search
      ApiRoute: GET /rooms

  GetDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/get_detail/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 15
      MemorySize: 128
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
    Metadata:
      Owner: room-information-search
      ApiRoute: GET /rooms/{room_number}

  GetRoomScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/get_room_schedule/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 15
      MemorySize: 128
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
    Metadata:
      Owner: room-information-search
      ApiRoute: GET /rooms/{room_number}/schedule

  SearchAvailableRoomsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/search_available_rooms/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
    Metadata:
      Owner: room-information-search
      ApiRoute: GET /rooms/available

  BookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/booking/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
    Metadata:
      Owner: booking-lifecycle
      Authorizer: cstu-jwt-authorizer
      ApiRoutes:
        - GET /bookings/me
        - GET /admin/bookings
        - POST /bookings
        - PATCH /bookings/{booking_id}
        - DELETE /bookings/{booking_id}
        - POST /bookings/{booking_id}/check-in
        - POST /bookings/{booking_id}/usage/end

  BookingFacilityManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/booking_facility_management/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
    Metadata:
      Owner: booking-lifecycle
      Authorizer: cstu-jwt-authorizer
      ApiRoutes:
        - GET /approvals/pending
        - POST /approvals/{booking_id}/decision
        - GET /admin/rooms
        - GET /room-closures
        - POST /rooms/{room_id}/availability
        - PUT /room-policies
        - GET /facility-schedule-rules
        - POST /facility-schedule-rules
        - POST /facility-schedule-rules/{schedule_id}/exceptions
        - GET /facility-schedules
        - POST /facility-schedules
        - PATCH /facility-schedules/{schedule_id}
        - POST /facility-schedules/{schedule_id}/cancel

  BookingNoShowFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/booking_no_show/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 128
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Events:
        NoShowSchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub '${AWS::StackName}-booking-no-show'
            Description: Mark NO_SHOW after 30-minute grace period and auto-complete checked-in bookings
            ScheduleExpression: rate(1 minute)
            State: !Ref NoShowScheduleState
            RetryPolicy:
              MaximumRetryAttempts: 0
    Metadata:
      Owner: booking-lifecycle
      Trigger: EventBridge Scheduler rate(1 minute)

  ManageRoomFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'cstu-v5-manage-room-${Environment}'
      CodeUri: ../lambda/manage_room/
      Handler: lambda_function.lambda_handler
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
    Metadata:
      Owner: room-management
      ApiRoutes:
        - PATCH /rooms/{room_id}
        - PATCH /rooms/{room_id}/status

  RoomConfigurationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'cstu-v5-room-configuration-${Environment}'
      CodeUri: ../lambda/room_configuration/
      Handler: lambda_function.lambda_handler
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      VpcConfig:
        SecurityGroupIds: !Ref VpcSecurityGroupIds
        SubnetIds: !Ref VpcSubnetIds
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
    Metadata:
      Owner: room-management
      ApiRoutes:
        - GET /room-types
        - GET /rooms/{room_number}/connections

  RoomImageUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'cstu-v5-room-image-upload-${Environment}'
      CodeUri: ../lambda/room_image_upload/
      Handler: lambda_function.lambda_handler
      Environment:
        Variables:
          IMAGE_BUCKET: !Ref ImageBucketName
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${ImageBucketName}/*'
    Metadata:
      Owner: room-management
      ApiRoutes:
        - POST /rooms/{room_id}/image-upload

Outputs:
  DatabaseHost:
    Description: RDS MySQL endpoint
    Value: !Ref DBHost

  DatabaseName:
    Description: Database name
    Value: !Ref DBName

  DatabasePort:
    Description: Database port
    Value: !Ref DBPort

  DeploymentEnvironment:
    Description: Deployment environment
    Value: !Ref Environment

  ManageRoomFunctionArn:
    Description: Manage room Lambda ARN
    Value: !GetAtt ManageRoomFunction.Arn

  RoomConfigurationFunctionArn:
    Description: Room configuration Lambda ARN
    Value: !GetAtt RoomConfigurationFunction.Arn

  RoomImageUploadFunctionArn:
    Description: Room image upload Lambda ARN
    Value: !GetAtt RoomImageUploadFunction.Arn
