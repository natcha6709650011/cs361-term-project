
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Shared Infrastructure as Code for CSTU Room Booking V5

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - x86_64
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DB_HOST: !Ref DBHost
        DB_NAME: !Ref DBName
        DB_PORT: !Ref DBPort
        DB_USER: !Ref DBUser

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Deployment environment

  DBHost:
    Type: String
    Default: cstu-room-database.cefikyua88rq.us-east-1.rds.amazonaws.com
    Description: CSTU RDS MySQL endpoint

  DBName:
    Type: String
    Default: cstu_room_db
    Description: Database name

  DBPort:
    Type: Number
    Default: 3306
    Description: RDS MySQL port

  DBUser:
    Type: String
    Default: admin
    Description: Database username

  DBPassword:
    Type: String
    NoEcho: true
    Description: Database password supplied at deployment time

  NoShowScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED
    Description: >
      State of the booking No-show / auto-complete schedule. Keep DISABLED while the
      V4 schedule still runs against the same database; set ENABLED at cut-over.
  # NEW: Security Module
  TuApiUrl:
    Type: String
    Description: TU authentication API endpoint

  FrontendOrigin:
    Type: String
    Description: Frontend origin for credentialed CORS requests

  MockLoginEnabled:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable mock login for development testing only

Conditions:
  AllowMockLogin: !And
    - !Equals [!Ref Environment, dev]
    - !Equals [!Ref MockLoginEnabled, 'true']

Resources:
  PyMySqlLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub '${AWS::StackName}-pymysql'
      Description: Shared PyMySQL dependency for RDS-backed Lambda functions
      ContentUri: ../pymysql-layer/
      CompatibleRuntimes:
        - python3.13
      CompatibleArchitectures:
        - x86_64
      RetentionPolicy: Retain

  GetRoomsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/get_rooms/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 15
      MemorySize: 128
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      Owner: room-information-search
      ApiRoute: GET /rooms

  GetDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/get_detail/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 15
      MemorySize: 128
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      Owner: room-information-search
      ApiRoute: GET /rooms/{room_number}

  GetRoomScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/get_room_schedule/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 15
      MemorySize: 128
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      Owner: room-information-search
      ApiRoute: GET /rooms/{room_number}/schedule

  SearchAvailableRoomsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/search_available_rooms/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      Owner: room-information-search
      ApiRoute: GET /rooms/available

  BookingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/booking/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      Owner: booking-lifecycle
      Authorizer: cstu-jwt-authorizer
      ApiRoutes:
        - GET /bookings/me
        - GET /admin/bookings
        - POST /bookings
        - PATCH /bookings/{booking_id}
        - DELETE /bookings/{booking_id}
        - POST /bookings/{booking_id}/check-in
        - POST /bookings/{booking_id}/usage/end

  BookingFacilityManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/booking_facility_management/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 256
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      Owner: booking-lifecycle
      Authorizer: cstu-jwt-authorizer
      ApiRoutes:
        - GET /approvals/pending
        - POST /approvals/{booking_id}/decision
        - GET /admin/rooms
        - GET /room-closures
        - POST /rooms/{room_id}/availability
        - PUT /room-policies
        - GET /facility-schedule-rules
        - POST /facility-schedule-rules
        - POST /facility-schedule-rules/{schedule_id}/exceptions
        - GET /facility-schedules
        - POST /facility-schedules
        - PATCH /facility-schedules/{schedule_id}
        - POST /facility-schedules/{schedule_id}/cancel

  BookingNoShowFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/booking_no_show/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 128
      Layers:
        - !Ref PyMySqlLayer
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      Policies:
        - AWSLambdaBasicExecutionRole
      Events:
        NoShowSchedule:
          Type: ScheduleV2
          Properties:
            Name: !Sub '${AWS::StackName}-booking-no-show'
            Description: Mark NO_SHOW after 30-minute grace period and auto-complete checked-in bookings
            ScheduleExpression: rate(1 minute)
            State: !Ref NoShowScheduleState
            RetryPolicy:
              MaximumRetryAttempts: 0
    Metadata:
      Owner: booking-lifecycle
      Trigger: EventBridge Scheduler rate(1 minute)

  # =====================================================
  # MODULE 3: AUTHENTICATION & SECURITY
  # =====================================================

  JwtPrivateKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AWS::StackName}/${Environment}/jwt-private-key'
      Description: Private key used to sign JWT tokens (RS256)
      Tags:
        - Key: Project
          Value: CSTU-RoomBooking-V5
        - Key: Environment
          Value: !Ref Environment

  TuApiKeySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${AWS::StackName}/${Environment}/tu-api-key'
      Description: API key used to authenticate with TU API
      Tags:
        - Key: Project
          Value: CSTU-RoomBooking-V5
        - Key: Environment
          Value: !Ref Environment

  # -----------------------------------------------------
  # 1. User Authentication
  # -----------------------------------------------------

  CstuUserAuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/cstu-user-auth/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
          TU_API_URL: !Ref TuApiUrl
          TU_API_KEY_SECRET_ARN: !Ref TuApiKeySecret
          JWT_PRIVATE_KEY_SECRET_ARN: !Ref JwtPrivateKeySecret
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          MOCK_LOGIN_ENABLED: !If [AllowMockLogin, 'true', 'false']
      Policies:
        - AWSLambdaBasicExecutionRole
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - !Ref JwtPrivateKeySecret
                - !Ref TuApiKeySecret
    Metadata:
      Owner: authentication-security
      Purpose: Login and JWT signing

  # -----------------------------------------------------
  # 2. JWT Authorizer
  # -----------------------------------------------------

  CstuJwtAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/cstu-jwt-authorizer/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 15
      MemorySize: 128
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      Owner: authentication-security
      Purpose: JWT signature and expiration verification

  # -----------------------------------------------------
  # 3. Room Permission
  # -----------------------------------------------------

  CstuRoomPermissionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/cstu-room-permission/
      Handler: lambda_function.lambda_handler
      Runtime: python3.13
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          DB_PASSWORD: !Ref DBPassword
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata:
      Owner: authentication-security
      Purpose: Room permission API and role authorization

Outputs:
  DatabaseHost:
    Description: RDS MySQL endpoint
    Value: !Ref DBHost

  DatabaseName:
    Description: Database name
    Value: !Ref DBName

  DatabasePort:
    Description: Database port
    Value: !Ref DBPort

  DeploymentEnvironment:
    Description: Deployment environment
    Value: !Ref Environment

  # Module 3 Outputs

  CstuUserAuthFunctionArn:
    Description: Lambda ARN for User Authentication
    Value: !GetAtt CstuUserAuthFunction.Arn

  CstuJwtAuthorizerFunctionArn:
    Description: Lambda ARN for JWT Authorizer
    Value: !GetAtt CstuJwtAuthorizerFunction.Arn

  CstuRoomPermissionFunctionArn:
    Description: Lambda ARN for Room Permission and Role Authorizer
    Value: !GetAtt CstuRoomPermissionFunction.Arn

  CstuJwtAuthorizerUri:
    Description: API Gateway Lambda Authorizer URI for JWT verification
    Value: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CstuJwtAuthorizerFunction.Arn}/invocations'

  CstuRoomPermissionAuthorizerUri:
    Description: API Gateway Lambda Authorizer URI for role authorization
    Value: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CstuRoomPermissionFunction.Arn}/invocations'

  JwtPrivateKeySecretArn:
    Description: Secrets Manager ARN for JWT Private Key
    Value: !Ref JwtPrivateKeySecret

  TuApiKeySecretArn:
    Description: Secrets Manager ARN for TU API Key
    Value: !Ref TuApiKeySecret
